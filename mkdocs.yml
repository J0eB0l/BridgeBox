# BridgeBox documentation, built the same way as the AFC Project documentation
# (https://www.afcproject.dev/) so the pages under docs/bridgebox/ can move into
# that site as their own section.
#
# Preview:  pip install mkdocs-material
#           mkdocs serve
site_name: BridgeBox Documentation
site_description: "BridgeBox documentation for the AFC-Klipper-Add-On"
site_url: https://bridgebox.dev/docs/
repo_url: https://github.com/J0eB0l/BridgeBox
edit_uri: 'blob/main/docs/'
repo_name: J0eB0l/BridgeBox
use_directory_urls: False

nav:
  - Home: index.md
  - BridgeBox:
      - Overview: bridgebox/index.md
      - Hardware and Wiring: bridgebox/hardware.md
      - Installation: bridgebox/installation.md
      - USB and WiFi: bridgebox/connection.md
      - Configuration: bridgebox/configuration.md
      - Bays, Lanes and Hot-Swap: bridgebox/bays.md
      - Spools, RFID and Spoolman: bridgebox/spools.md
      - Drying: bridgebox/drying.md
      - AMS Lite: bridgebox/ams-lite.md
      - Firmware Updates: bridgebox/firmware.md
      - Touchscreen Display: bridgebox/display.md
      - Klipper Commands: bridgebox/commands.md
      - Troubleshooting: bridgebox/troubleshooting.md
  - AFC Documentation: https://www.afcproject.dev/

theme:
  icon:
    repo: fontawesome/brands/github
  name: material
  logo: assets/logo.webp
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/theme-light-dark
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/theme-light-dark
        name: Switch to light mode
  primary: custom

  features:
    - content.code.copy
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - search.share
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - toc.follow

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AFCProject/AFC-Klipper-Add-On
      name: AFC-Klipper-Add-On on GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/z2tgWEnfDT
      name: Join us on Discord!
